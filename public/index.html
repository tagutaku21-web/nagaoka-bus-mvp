<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>長岡バス直感検索 MVP</title>
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <main class="app-shell">
      <section class="search-panel" aria-labelledby="app-title">
        <p class="eyebrow">長岡市 直通検索MVP</p>
        <h1 id="app-title">バス停を押して、次のバスを見る</h1>

        <div class="field">
          <label for="origin-search">出発バス停</label>
          <input id="origin-search" type="search" placeholder="例: 長岡駅 大手口">
        </div>

        <div class="field">
          <label for="destination-search">目的地</label>
          <input id="destination-search" type="search" placeholder="例: 日赤病院前 / リバーサイド千秋">
        </div>

        <div class="time-grid">
          <div class="field">
            <label for="ride-date">日付</label>
            <input id="ride-date" type="date">
          </div>
          <div class="field">
            <label for="ride-time">時刻</label>
            <input id="ride-time" type="time">
          </div>
        </div>

        <div class="selected">
          <p id="origin-label">出発: 未選択</p>
          <p id="destination-label">目的地: 未選択</p>
        </div>

        <button id="search-button" type="button">次のバスを見る</button>
        <p id="status" class="status">GTFSデータを読み込み中です。</p>
      </section>

      <section class="map-panel" aria-label="バス停マップ">
        <div id="map" class="map"></div>
      </section>

      <section class="result-panel" aria-live="polite">
        <div id="result-empty" class="empty">
          <h2>どこから、どこへ？</h2>
          <p>左の検索、または地図上のバス停から出発地を選んでください。</p>
        </div>
        <div id="result" class="result hidden"></div>
      </section>
    </main>

    <template id="stop-pin-template">
      <button class="stop-pin" type="button"></button>
    </template>

    <script type="module" src="./app.js"></script>
  </body>
</html>
