<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>長岡バス直感検索 MVP</title>
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    >
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <main class="app-shell">
      <section class="search-panel" aria-labelledby="app-title">
        <p class="eyebrow">長岡市 直通検索MVP</p>
        <h1 id="app-title">バス停を押して、次のバスを見る</h1>

        <div class="quick-route" aria-label="検証用ルート">
          <button id="sample-route-button" type="button">長岡駅前 → 日赤病院前</button>
        </div>

        <div class="destination-presets" aria-label="目的地候補">
          <p>目的地候補</p>
          <div class="preset-grid">
            <button type="button" data-destination="日赤病院前" data-destination-label="長岡赤十字病院">長岡赤十字病院</button>
            <button type="button" data-destination="子育ての駅千秋" data-destination-label="リバーサイド千秋">リバーサイド千秋</button>
            <button type="button" data-destination="アオーレ長岡前" data-destination-label="アオーレ長岡">アオーレ長岡</button>
            <button type="button" data-destination="長岡駅前" data-destination-label="長岡駅">長岡駅</button>
            <button type="button" data-destination="立川綜合病院" data-destination-label="立川綜合病院">立川綜合病院</button>
            <button type="button" data-destination="長岡西病院前" data-destination-label="長岡西病院">長岡西病院</button>
            <button type="button" data-destination="イオン長岡店前" data-destination-label="イオン長岡">イオン長岡</button>
            <button type="button" data-destination="ハイブ長岡" data-destination-label="ハイブ長岡">ハイブ長岡</button>
            <button type="button" data-destination="越後丘陵公園" data-destination-label="越後丘陵公園">越後丘陵公園</button>
            <button type="button" data-destination="長岡造形大学前" data-destination-label="長岡造形大学">長岡造形大学</button>
            <button type="button" data-destination="北長岡駅角" data-destination-label="北長岡駅">北長岡駅</button>
          </div>
        </div>

        <div class="field">
          <label for="origin-search">出発バス停</label>
          <input id="origin-search" type="search" placeholder="例: 長岡駅 大手口">
          <button id="current-location-button" class="secondary-button" type="button">
            現在地に近いバス停を探す
          </button>
        </div>

        <div class="field">
          <label for="destination-search">目的地</label>
          <input id="destination-search" type="search" placeholder="例: 日赤病院前 / リバーサイド千秋">
        </div>

        <div class="time-grid">
          <div class="field">
            <label for="ride-date">日付</label>
            <input id="ride-date" type="date">
          </div>
          <div class="field">
            <label for="ride-time">時刻</label>
            <input id="ride-time" type="time">
          </div>
        </div>

        <div class="selected">
          <div id="origin-summary" class="selected-row">
            <span class="step-badge">1</span>
            <div>
              <span class="selected-title">出発</span>
              <strong id="origin-label">未選択</strong>
            </div>
          </div>
          <div id="destination-summary" class="selected-row">
            <span class="step-badge">2</span>
            <div>
              <span class="selected-title">目的地</span>
              <strong id="destination-label">未選択</strong>
            </div>
          </div>
        </div>

        <button id="swap-button" class="secondary-button" type="button" disabled>出発と目的地を入れ替える</button>
        <button id="search-button" type="button">次のバスを見る</button>
        <p id="status" class="status">GTFSデータを読み込み中です。</p>
      </section>

      <section class="map-panel" aria-label="バス停マップ">
        <div id="map" class="map"></div>
        <div id="map-summary" class="map-summary">地図を読み込み中です。</div>
      </section>

      <section class="result-panel" aria-live="polite">
        <div id="result-empty" class="empty">
          <h2>どこから、どこへ？</h2>
          <p>左の検索、または地図上のバス停から出発地を選んでください。</p>
        </div>
        <div id="result" class="result hidden"></div>
      </section>
    </main>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script type="module" src="./app.js"></script>
  </body>
</html>
